name: Reproduce numerical results
on:
  push:
    branches: [main]
    paths:
      - 'code/**'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Reproduce results and figures
        run: python code/reference_certificate.py
      - name: Commit generated tables and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ figures/
          if ! git diff --cached --quiet; then
            git commit -m "Archive reproduced numerical results and figures"
            git push
          fi
